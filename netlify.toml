[build]
  base = "2027_%E6%98%A5%E8%8A%82%E5%85%B3%E4%B8%9C%E4%B9%8B%E8%A1%8C_%E5%8E%9F%E6%A0%B7%E8%AE%BE%E8%AE%A1_%E4%BA%91%E7%AB%AF%E5%90%8C%E6%AD%A5%E7%89%88"
  command = ""
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Preserve the app's API route and security headers.
[[redirects]]
  from = "/api/trip"
  to = "/.netlify/functions/trip"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
