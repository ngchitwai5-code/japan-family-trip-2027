 <div class="daily-grid"><section class="panel timeline-panel"><div class="card-heading"><div class="card-title">当天安排 <span class="micro">· ${day.events.length} 个事项</span></div><button class="mini-add edit-only" data-action="add-event" data-id="${day.id}">＋ 新增行程</button></div><div class="timeline">${day.events.length?day.events.map(ev=>`<div class="event"><div class="event-time">${e(ev.time)}</div><div class="event-bullet ${e(ev.type)}"></div><div class="event-main"><div class="event-top"><h4>${e(ev.title)}</h4><button class="event-edit edit-only" data-action="edit-event" data-id="${e(ev.id)}" data-day="${day.id}">编辑</button></div><p>${e(ev.note)}</p><div class="event-meta">${ev.location?`<a href="${gmap(ev.location)}" target="_blank" rel="noopener" class="chip">⌖ ${e(ev.location)} ↗</a>`:''}<span class="chip ${ev.status==='confirmed'?'confirmed':'draft'}">${e(statuses[ev.status]||'待确认')}</span></div></div></div>`).join(''):'<div class="empty-state">这一天还没有具体安排</div>'}</div></section>
 <div class="rail"><div class="panel rail-card"><div class="head"><span class="symbol">🏨</span><span class="card-title">当晚住宿</span></div><p class="stay-name">${e(day.hotel)}</p><div class="stay-sub">${day.id===9?'当日没有住宿安排':e(day.place)+' · 具体酒店可在「预订」添加'}</div><hr><p class="rail-note">✦ 预订信息集中保存在「航班与住宿」，可记录酒店、住客和确认状态。</p></div></div></div>`}
function bookingsHTML(){let list=data.bookings.filter(b=>filter==='all'||b.type===filter);let confirmed=data.bookings.filter(b=>b.status==='confirmed').length;return `<div class="stats"><div class="stat"><strong>${data.bookings.length}</strong><span>计划项目</span></div><div class="stat"><strong>${confirmed}</strong><span>已经确认</span></div><div class="stat"><strong>${data.bookings.length-confirmed}</strong><span>尚待确认</span></div></div><div class="subsection-header"><h3>全部预订</h3><button class="mini-add edit-only" data-action="add-booking">＋ 添加预订</button></div><div class="filter-row">${[['all','全部'],['flight','航班'],['stay','酒店'],['car','租车'],['ticket','门票'],['other','其他']].map(([v,n])=>`<button class="filter ${v===filter?'active':''}" data-filter="${v}">${n}</button>`).join('')}</div><div class="booking-list">${list.length?list.map(b=>`<div class="booking panel"><div class="booking-top"><span class="booking-type">${e(types[b.type]||'其他')}</span><span class="chip ${b.status==='confirmed'?'confirmed':'draft'}">${e(statuses[b.status]||'待确认')}</span></div><h3 class="booking-title">${e(b.title)}</h3><div class="booking-date">📅 ${e(b.dates)}</div><div class="booking-details">${e(b.details)}${b.reference?'<br>参考编号：'+e(b.reference):''}</div><div class="booking-foot"><span class="booking-persons">${e(b.people)}</span><button class="small-btn edit-only" data-action="edit-booking" data-id="${e(b.id)}">编辑信息</button></div></div>`).join(''):'<div class="empty-panel">该类别暂时没有预订记录</div>'}</div><div class="route-warning">🔒 提醒：发布成家庭共享网址后，不要存放护照号码、完整机票预订编码或其他敏感信息。家人可查看预订状态，但不建议把原始证件数据写在公开页面。</div>`}
function mapHTML(){return `<section class="panel map-board"><div class="map-intro"><h3>🗺️ 东京 · 箱根 · 伊豆自驾路线</h3><p>2月5日东京取车 → 箱根连住2晚 → 2月7日伊豆 → 2月8日回东京。御殿场为富士山可选绕行地点；地图路线为位置示意，非实时道路导航。</p></div><div class="map-canvas" id="mapCanvas"><div class="map-fallback"><div><span class="map-icon">🗾</span>正在加载地图…<br><small>也可以直接用下方按钮打开导航</small></div></div></div><div class="route-list">${places.slice(0,4).map(p=>`<a class="route-stop" style="text-decoration:none" href="${gmap(p.query)}" target="_blank" rel="noopener"><span class="pin">${p.icon}</span><strong>${p.name}</strong><small>${p.subtitle} ↗</small></a>`).join('')}</div><div class="map-actions"><a href="https://www.google.com/maps/dir/?api=1&origin=Tokyo%2CJapan&destination=Izu%2CShizuoka%2CJapan&waypoints=Hakone%2CKanagawa%2CJapan&travelmode=driving" target="_blank" rel="noopener">🚗 东京 → 箱根 → 伊豆</a><a href="https://www.google.com/maps/dir/?api=1&origin=Izu%2CShizuoka%2CJapan&destination=Tokyo%2CJapan&travelmode=driving" target="_blank" rel="noopener">🚗 伊豆 → 东京（直达）</a><a href="https://www.google.com/maps/dir/?api=1&origin=Izu%2CShizuoka%2CJapan&destination=Tokyo%2CJapan&waypoints=Gotemba%2CShizuoka%2CJapan&travelmode=driving" target="_blank" rel="noopener">🗻 经御殿场（可选）</a><a href="${gmap('Tokyo Disney Resort Japan')}" target="_blank" rel="noopener">🏰 东京迪士尼</a></div></section><div class="route-warning">⚠️ 2月箱根及富士山周边有可能出现降雪与结冰。正式开车请使用实时导航、关注封路信息，并确认驾驶资格和适合冬季的车辆装备。</div>`}
function initMap(){const c=element('mapCanvas');if(!c)return;if(!window.L){c.innerHTML='<div class="map-fallback"><div><span class="map-icon">🗾</span>地图服务暂时不可用<br>可使用下方 Google Maps 路线按钮</div></div>';return}try{c.innerHTML='';mapObject=L.map(c,{scrollWheelZoom:false}).setView([35.28,139.45],8);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:17}).addTo(mapObject);const col=['#285e51','#ef9576','#43a1a3','#d2a055','#3972a5'];places.forEach((p,i)=>{const pin=L.circleMarker([p.lat,p.lng],{radius:9,color:'#fff',weight:2,fillColor:col[i],fillOpacity:1}).addTo(mapObject);pin.bindPopup(`<strong>${e(p.name)}</strong><br>${e(p.subtitle)}<br><a href="${gmap(p.query)}" target="_blank">打开导航 ↗</a>`)});L.polyline([[35.6762,139.6503],[35.2325,139.1069],[34.976,138.946],[35.6762,139.6503]],{color:'#4a8a78',weight:4,opacity:.8,dashArray:'7,9'}).addTo(mapObject);mapObject.fitBounds([[34.90,138.83],[35.78,139.98]],{padding:[20,20]});setTimeout(()=>mapObject?.invalidateSize(),250)}catch(err){c.innerHTML='<div class="map-fallback"><div>地图暂时不可用，请使用下方导航链接</div></div>'}}
function todosHTML(){const done=data.todos.filter(t=>t.done).length;const pct=data.todos.length?Math.round(done/data.todos.length*100):100;return `<div class="panel todo-progress"><div class="progress-head"><strong>行前准备进度</strong><span>${done} / ${data.todos.length} 已完成 · ${pct}%</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="micro">点击「自由编辑」即可勾选、增删事项；保存后全家都能看到更新。</div></div><div class="todo-group"><h3>✦ 全家出发前要做的事</h3>${data.todos.map(t=>`<label class="todo-item ${t.done?'done':''}"><input type="checkbox" class="todo-check" data-todo="${e(t.id)}" ${t.done?'checked':''} ${!edit?'disabled':''}><span>${e(t.text)}</span><button class="remove edit-only" type="button" data-action="remove-todo" data-id="${e(t.id)}" title="删除">×</button></label>`).join('')}<form id="todoForm" class="todo-add edit-only"><input name="todoText" maxlength="180" placeholder="新增待办事项，例如：预约除夕晚餐" required><button type="submit">＋ 添加</button></form></div>`}
function settingsHTML(){return `<div class="settings-grid"><section class="panel settings-card"><h3>📲 分享给家人</h3><p>部署到线上后，将同一个固定网址发到微信群。家人无需安装 App，手机浏览器直接打开，即可切换日期、看地图与预订状态。</p><button class="primary" data-action="share">分享 / 复制网址</button><div class="warning">${cloud?'已连接云端。保存修改后，家人重新打开或稍后刷新即可看见。':'当前是本地预览：此设备上的修改不会自动同步到家人手机。要实时共享，需要部署配套的云端服务。'}</div></section><section class="panel settings-card"><h3>✏️ 全家自由编辑</h3><p>无需管理员密码。打开网站的任何人都可点击「自由编辑」，修改行程、预订和待办，保存后同步给大家。</p><button class="secondary" data-action="toggle-edit">${edit?'完成编辑':'开始编辑'}</button><div class="warning">提醒：知道网址的人都可以修改或删除内容。请只分享给可信家人，并定期在本页导出 JSON 备份；不要填写敏感资料。</div></section><section class="panel settings-card"><h3>📦 数据备份</h3><p>支持导出完整行程 JSON，包括日期、预订和待办。可以离线备份，或者在当前浏览器导入恢复。</p><button class="secondary" data-action="export">⬇ 导出行程 JSON</button><button class="secondary edit-only" data-action="import">↥ 导入 JSON</button><input type="file" id="importFile" accept=".json,application/json" style="display:none"></section><section class="panel settings-card"><h3>📝 关于这份旅行手帐</h3><p>2027年2月3日至11日，5位家人在东京集合，经过箱根、伊豆，再回东京迪士尼与自由行。除夕2月5日，春节初一2月6日。</p><div class="notice">全程9天8晚 · 香港1晚 · 东京4晚 · 箱根2晚 · 伊豆1晚<br>租车：2月5日取车、2月8日还车（待订）</div></section></div>`}
function modal(content){element('modalRoot').innerHTML=`<div class="modal-overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true">${content}</div></div>`;}
function closeModal(){element('modalRoot').innerHTML=''}
function field(name,label,value='',tag='input',other=''){const v=e(value);return `<div class="field"><label for="field-${name}">${label}</label>${tag==='textarea'?`<textarea id="field-${name}" name="${name}" ${other}>${v}</textarea>`:`<input id="field-${name}" name="${name}" value="${v}" ${other}>`}</div>`}
function optionSelect(name,label,opts,value){return `<div class="field"><label for="field-${name}">${label}</label><select name="${name}" id="field-${name}">${opts.map(([v,l])=>`<option value="${e(v)}" ${v===value?'selected':''}>${e(l)}</option>`).join('')}</select></div>`}
function modalHeader(title){return `<div class="modal-head"><h2>${e(title)}</h2><button class="close-modal" type="button" data-action="close" aria-label="关闭">×</button></div>`}
function beginEdit(){edit=!edit;toast(edit?(cloud?'已进入自由编辑 · 保存后全家同步':'已进入自由编辑 · 当前仅保存本设备'):'已完成编辑');render()}
function editDayForm(id){const d=data.days.find(d=>d.id===id);if(!d)return;modal(`${modalHeader('修改 2月'+(id+2)+'日信息')}<form id="dayForm" data-id="${id}">${field('title','当天标题',d.title,'input','required maxlength="120"')}${field('summary','当天简介',d.summary,'textarea','maxlength="500"')}${field('hotel','当晚住宿说明',d.hotel,'input','maxlength="120"')}${field('icon','当天图标 Emoji',d.icon,'input','maxlength="8"')}<div class="modal-actions"><button class="secondary" type="button" data-action="close">取消</button><button type="submit" class="primary">保存修改</button></div></form>`)}
function eventForm(dayId,eventId){const d=data.days.find(d=>d.id===dayId);if(!d)return;const item=d.events.find(x=>x.id===eventId)||{time:'待定',title:'',type:'visit',note:'',location:'',status:'planned'};modal(`${modalHeader(eventId?'修改行程':'新增 2月'+(dayId+2)+'日行程')}<form id="eventForm" data-day="${dayId}" data-event="${eventId||''}"><div class="field-grid">${field('time','时间 / 时段',item.time,'input','maxlength="30"')}${optionSelect('type','类别',Object.entries(eventTypes).map(([v,l])=>[v,l]),item.type)}</div>${field('title','事项标题',item.title,'input','required maxlength="140"')}${field('note','备注 / 说明',item.note,'textarea','maxlength="800"')}${field('location','地点（可打开地图）',item.location,'input','maxlength="160"')}${optionSelect('status','状态',Object.entries(statuses).map(([v,l])=>[v,l]),item.status)}<div class="modal-actions">${eventId?'<button type="button" class="danger-btn" data-action="delete-event" data-day="'+dayId+'" data-id="'+e(eventId)+'">删除</button>':''}<button class="secondary" type="button" data-action="close">取消</button><button type="submit" class="primary">保存行程</button></div></form>`)}
function bookingForm(id){let b=data.bookings.find(b=>b.id===id)||{type:'stay',title:'',dates:'',people:'一家五口',details:'',status:'pending',location:'',reference:''};modal(`${modalHeader(id?'修改预订信息':'新增预订')}<form id="bookingForm" data-id="${e(id||'')}"><div class="field-grid">${optionSelect('type','预订类型',Object.entries(types).map(([v,l])=>[v,l]),b.type)}${optionSelect('status','确认状态',Object.entries(statuses).map(([v,l])=>[v,l]),b.status)}</div>${field('title','标题 / 名称',b.title,'input','required maxlength="160"')}<div class="field-grid">${field('dates','日期',b.dates,'input','maxlength="120"')}${field('people','涉及成员',b.people,'input','maxlength="100"')}</div>${field('details','航班号 / 住宿信息 / 预订备注',b.details,'textarea','maxlength="600"')}${field('location','目的地 / 位置',b.location,'input','maxlength="140"')}${field('reference','参考编号（不建议填写敏感凭证）',b.reference,'input','maxlength="100"')}<div class="modal-actions">${id?'<button class="danger-btn" type="button" data-action="delete-booking" data-id="'+e(id)+'">删除</button>':''}<button class="secondary" type="button" data-action="close">取消</button><button class="primary" type="submit">保存预订</button></div></form>`)}
function downloadFile(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='2027春节家庭日本旅行_备份.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('已导出行程备份')}
async function share(){const url=window.location.href.split('#')[0];const msg='🇯🇵 2027 春节日本关东家庭旅行\n2月3–11日｜东京 · 箱根 · 伊豆 · 富士山\n'+url;if(navigator.share&&/^https?:/.test(url)){try{await navigator.share({title:'春节日本家庭旅行',text:'春节关东之行 · 2027家庭旅行',url});return}catch(_){}}try{await navigator.clipboard.writeText(msg);toast('已复制网址，可粘贴到微信')}catch(_){const t=document.createElement('textarea');t.value=msg;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('已复制分享内容')}catch(_){toast('请复制浏览器地址栏网址')}t.remove()}}
function formData(form){return Object.fromEntries(new FormData(form).entries())}
document.addEventListener('click',async ev=>{const tabEl=ev.target.closest('[data-tab]');if(tabEl){setTab(tabEl.dataset.tab);return}const dayEl=ev.target.closest('[data-day]');if(dayEl&&dayEl.classList.contains('day-pill')){activeDay=+dayEl.dataset.day;render();return}const f=ev.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return}const act=ev.target.closest('[data-action]');if(!act)return;const {action,id,day}=act.dataset;if(action==='close'){closeModal();return}if(action==='toggle-edit'){beginEdit();return}if(action==='edit-day'&&edit){editDayForm(+id);return}if(action==='add-event'&&edit){eventForm(+id);return}if(action==='edit-event'&&edit){eventForm(+day,id);return}if(action==='add-booking'&&edit){bookingForm();return}if(action==='edit-booking'&&edit){bookingForm(id);return}if(action==='export'){downloadFile();return}if(action==='import'&&edit){element('importFile')?.click();return}if(action==='share'){share();return}if(action==='delete-event'&&edit){if(!confirm('确定删除这条行程吗？'))return;const d=data.days.find(d=>d.id===+day);if(!d)return;d.events=d.events.filter(x=>x.id!==id);closeModal();render();await persist();return}if(action==='delete-booking'&&edit){if(!confirm('确定删除这条预订吗？'))return;data.bookings=data.bookings.filter(x=>x.id!==id);closeModal();render();await persist();return}if(action==='remove-todo'&&edit){data.todos=data.todos.filter(t=>t.id!==id);render();await persist();return}});
document.addEventListener('submit',async ev=>{const f=ev.target;if(!['dayForm','eventForm','bookingForm','todoForm'].includes(f.id))return;ev.preventDefault();const v=formData(f);if(f.id==='dayForm'){const d=data.days.find(d=>d.id===+f.dataset.id);if(!d)return;d.title=v.title.trim();d.summary=v.summary.trim();d.hotel=v.hotel.trim();d.icon=v.icon.trim()||'📍'}if(f.id==='eventForm'){const d=data.days.find(d=>d.id===+f.dataset.day);if(!d)return;let ex=d.events.find(x=>x.id===f.dataset.event);if(!ex){ex={id:uid()};d.events.push(ex)}Object.assign(ex,{time:v.time.trim(),type:v.type,title:v.title.trim(),note:v.note.trim(),location:v.location.trim(),status:v.status})}if(f.id==='bookingForm'){let b=data.bookings.find(x=>x.id===f.dataset.id);if(!b){b={id:uid()};data.bookings.push(b)}Object.assign(b,{type:v.type,title:v.title.trim(),dates:v.dates.trim(),people:v.people.trim(),details:v.details.trim(),status:v.status,location:v.location.trim(),reference:v.reference.trim()})}if(f.id==='todoForm'){if(!edit)return;const t=v.todoText.trim();if(!t)return;data.todos.push({id:uid(),text:t,done:false})}closeModal();render();await persist()});
document.addEventListener('change',async ev=>{const t=ev.target;if(t.matches('[data-todo]')&&edit){const item=data.todos.find(x=>x.id===t.dataset.todo);if(item){item.done=t.checked;render();await persist()}}if(t.id==='importFile'&&edit){const file=t.files&&t.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!obj||!Array.isArray(obj.days)||obj.days.length!==9||!Array.isArray(obj.bookings)||!Array.isArray(obj.todos))throw Error('文件结构不正确');if(!confirm('导入会替换当前行程。确定继续？'))return;data=obj;render();await persist()}catch(err){toast('导入失败：'+err.message)}}});
element('editToggle').addEventListener('click',beginEdit);element('shareBtn').addEventListener('click',share);
// 作为独立 HTML 直接打开时使用本地数据；云端部署后自动从 /api/trip 同步。
render();checkCloud();setInterval(poll,30000);
})();
