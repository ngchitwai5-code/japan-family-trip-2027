[build]
  publish = "public"
  functions = "netlify/functions"

# The app calls this route for shared family updates.
[[redirects]]
  from = "/api/trip"
  to = "/.netlify/functions/trip"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
